name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: bun run lint
        continue-on-error: true # Prevents strict json output format issues from breaking the build if desired

      - name: Verify Build
        run: bun run build
